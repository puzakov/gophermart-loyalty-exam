services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=gophermart_db_user
      - POSTGRES_DB=gophermart_db_app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5434:5432

  postgres_accrual:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=accrual_db_user
      - POSTGRES_DB=accrual_db_app
    volumes:
      - postgres-data-accrual:/var/lib/postgresql/data
    ports:
      - 5435:5432

volumes:
  postgres-data:
  postgres-data-accrual: