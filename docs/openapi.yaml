openapi: 3.0.3
info:
  title: Gophermart Loyalty API
  version: "1.0.0"
  description: |
    Расширенная спецификация HTTP API накопительной системы лояльности «Гофермарт».
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: orders
  - name: balance
  - name: withdrawals
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string, format: password }
    Tokens:
      type: object
      required: [access_token]
      properties:
        access_token: { type: string }
    Order:
      type: object
      required: [number, status, uploaded_at]
      properties:
        number: { type: string, example: "12345678903" }
        status:
          type: string
          enum: [NEW, PROCESSING, INVALID, PROCESSED]
        accrual:
          type: number
          format: double
          nullable: true
        uploaded_at:
          type: string
          format: date-time
    Balance:
      type: object
      required: [current, withdrawn]
      properties:
        current: { type: number, format: double }
        withdrawn: { type: number, format: double }
    WithdrawRequest:
      type: object
      required: [order, sum]
      properties:
        order: { type: string }
        sum: { type: number, format: double }
    Withdrawal:
      type: object
      required: [order, sum, processed_at]
      properties:
        order: { type: string }
        sum: { type: number, format: double }
        processed_at: { type: string, format: date-time }
paths:
  /api/user/register:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { description: Bad Request }
        "409": { description: Conflict }
        "500": { description: Internal Server Error }
  /api/user/login:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { description: Bad Request }
        "401": { description: Unauthorized }
        "500": { description: Internal Server Error }
  /api/user/orders:
    post:
      tags: [orders]
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              example: "12345678903"
      responses:
        "200": { description: Already uploaded by same user }
        "202": { description: Accepted }
        "400": { description: Bad Request }
        "401": { description: Unauthorized }
        "409": { description: Conflict }
        "422": { description: Unprocessable Entity }
        "500": { description: Internal Server Error }
    get:
      tags: [orders]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "204": { description: No Content }
        "401": { description: Unauthorized }
        "500": { description: Internal Server Error }
  /api/user/balance:
    get:
      tags: [balance]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balance" }
        "401": { description: Unauthorized }
        "500": { description: Internal Server Error }
  /api/user/balance/withdraw:
    post:
      tags: [withdrawals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithdrawRequest" }
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }
        "402": { description: Payment Required }
        "422": { description: Unprocessable Entity }
        "500": { description: Internal Server Error }
  /api/user/withdrawals:
    get:
      tags: [withdrawals]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Withdrawal" }
        "204": { description: No Content }
        "401": { description: Unauthorized }
        "500": { description: Internal Server Error }

